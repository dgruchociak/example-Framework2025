trigger:
- main  # Uruchom dla zmian w gałęzi main

pool:

  name: 'test-laptop' # <--- ZMIEŃ NA WŁAŚCIWĄ NAZWĘ PULI

variables:
  - group: Vars

  # 2. Konfiguracja budowania
  - name: buildConfiguration
    value: 'Release'

  # 3. Wzorzec dla plików projektów do przywrócenia/zbudowania (wszystkie .csproj)
  - name: projectPattern
    value: '**/*.csproj'

  # 4. Ścieżka/Wzorzec do głównego projektu testowego (Playwright)
  #    !!! DOSTOSUJ, JEŚLI ŚCIEŻKA JEST INNA !!!
  - name: playwrightTestProject
    value: '**/PlaywrightExample/PlaywrightExample.csproj' # Celuje w konkretny projekt testowy

# Kroki wykonywane przez agenta self-hosted:
steps:

# Krok 1: Upewnij się, że dostępna jest właściwa wersja .NET SDK
# (Możesz usunąć, jeśli masz pewność, że agent ma już wymaganą wersję)
- task: UseDotNet@2
  displayName: 'Use .NET 8.0 SDK'
  inputs:
    packageType: 'sdk'
    version: '8.0.x'
    performMultiLevelLookup: true

# Krok 2: Przywróć zależności NuGet dla WSZYSTKICH projektów .csproj
- task: DotNetCoreCLI@2
  displayName: 'Restore NuGet packages for all projects'
  inputs:
    command: 'restore'
    projects: $(projectPattern) # Używa wzorca '**/*.csproj'
    feedsToUse: 'select'

# Krok 3: Zbuduj WSZYSTKIE projekty .csproj
- task: DotNetCoreCLI@2
  displayName: 'Build all projects'
  inputs:
    command: 'build'
    projects: $(projectPattern) # Używa wzorca '**/*.csproj'
    arguments: '--configuration $(buildConfiguration) --no-restore'

# Krok 4: Uruchom testy Playwright (NUnit)
# Używa tokenu Testcontainers Cloud z Variable Group do tworzenia kontenerów w chmurze.
- task: DotNetCoreCLI@2
  displayName: 'Run Playwright Tests with Testcontainers Cloud'
  inputs:
    command: 'test'
    # Celuje tylko w projekt testowy Playwright - dostosuj w razie potrzeby!
    projects: $(playwrightTestProject)
    arguments: '--configuration $(buildConfiguration) --no-build --logger "trx;LogFileName=playwright-test-results.trx"'
    publishTestResults: false # Publikacja w osobnym kroku

# Krok 5: Opublikuj wyniki testów Playwright
- task: PublishTestResults@2
  displayName: 'Publish Playwright Test Results'
  condition: succeededOrFailed()
  inputs:
    testResultsFormat: 'VSTest'
    testResultsFiles: '**/playwright-test-results.trx' # Wyszukaj plik z wynikami Playwright
    searchFolder: '$(System.DefaultWorkingDirectory)'
    mergeTestResults: true
    failTaskOnFailedTests: true
    testRunTitle: 'Playwright Tests ($(Agent.JobName))'

# --- Opcjonalnie: Dodaj kroki dla innych testów (np. SeleniumRestsharp) ---
# Jeśli masz inne projekty testowe (np. w folderze SeleniumRestsharp),
# możesz skopiować i dostosować kroki 4 i 5 dla nich:
#
- task: DotNetCoreCLI@2
  displayName: 'Run Selenium Tests with Testcontainers Cloud'
  inputs:
    command: 'test'
    projects: '**/SeleniumRestsharp/**/TwojProjektTestowySelenium.csproj' # <-- DOSTOSUJ ŚCIEŻKĘ!
    arguments: '--configuration $(buildConfiguration) --no-build --logger "trx;LogFileName=selenium-test-results.trx"'
    publishTestResults: false

- task: PublishTestResults@2
  displayName: 'Publish Selenium Test Results'
  condition: succeededOrFailed()
  inputs:
    testResultsFormat: 'VSTest'
    testResultsFiles: '**/selenium-test-results.trx' # <-- Zwróć uwagę na inną nazwę pliku
    searchFolder: '$(System.DefaultWorkingDirectory)'
    mergeTestResults: true # Wyniki zostaną połączone w ADO
    failTaskOnFailedTests: true
    testRunTitle: 'Selenium Tests ($(Agent.JobName))'
