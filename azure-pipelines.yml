# ==============================================================================
# Azure Pipelines YAML dla repozytorium GitHub
# Cel: Uruchomienie testów .NET wykorzystujących Testcontainers Cloud
# ==============================================================================

# Trigger: Uruchom pipeline przy każdym push do gałęzi 'main'
trigger:
- main

# Agent Pool: Użyj agenta hostowanego przez Microsoft (Ubuntu)
# Nie potrzebujemy lokalnego Dockera, bo Testcontainers Cloud zajmie się kontenerami.
pool:
  name: 'test-laptop'

# Zmienne:
variables:
  # 1. Link do grupy zmiennych z sekretami Testcontainers Cloud
  #    Upewnij się, że grupa 'TestcontainersCloudCredentials' istnieje w ADO Library
  #    i zawiera sekret o nazwie 'TESTCONTAINERS_CLOUD_TOKEN'.
  - group: Vars

  # 2. Konfiguracja budowania
  - name: buildConfiguration
    value: 'Release'


  # 4. (Opcjonalnie) Wzorzec dla projektów testowych - dostosuj, jeśli potrzeba
  - name: testProjectPattern
    value: '**/PlaywrightExample/*.csproj' # Wyszukuje projekty .csproj w folderach kończących się na 'Tests' lub 'tests'

# Kroki (sekwencja zadań do wykonania):
steps:

# Krok 1: Użyj konkretnej wersji .NET SDK (dobra praktyka dla spójności)
- task: UseDotNet@2
  displayName: 'Use .NET 8.0 SDK'
  inputs:
    packageType: 'sdk'
    version: '8.0.x'     # Możesz zmienić na wymaganą wersję, np. '7.0.x', '6.0.x'
    performMultiLevelLookup: true # Wyszukaj SDK na różnych poziomach

# Krok 2: Przywróć zależności NuGet
- task: DotNetCoreCLI@2
  displayName: 'Restore NuGet packages'
  inputs:
    command: 'restore'
    projects: $(solutionPath)  # Użyj zmiennej ze ścieżką do solucji
    feedsToUse: 'select'      # Użyj feedów NuGet z organizacji ADO lub nuget.org

# Krok 4: Uruchom testy .NET
# Biblioteka Testcontainers.NET automatycznie wykryje zmienną środowiskową
# TESTCONTAINERS_CLOUD_TOKEN (dzięki zlinkowanej Variable Group) i użyje chmury.
- task: DotNetCoreCLI@2
  displayName: 'Run .NET tests with Testcontainers Cloud'
  inputs:
    command: 'test'
    projects: $(testProjectPattern) # Użyj zmiennej ze wzorcem projektów testowych
    arguments: '--configuration $(buildConfiguration) --no-build --logger "trx;LogFileName=test-results.trx"' # Uruchom testy, nie buduj ponownie, zapisz wyniki do pliku TRX
    publishTestResults: false    # Wyniki opublikujemy w osobnym, dedykowanym kroku

# Krok 5: Opublikuj wyniki testów w Azure DevOps
# Ten krok zbiera pliki .trx i wyświetla wyniki w zakładce 'Tests' w ADO.
- task: PublishTestResults@2
  displayName: 'Publish Test Results'
  # Uruchom ten krok nawet jeśli poprzedni (testy) zawiódł, aby zobaczyć wyniki
  condition: succeededOrFailed()
  inputs:
    testResultsFormat: 'VSTest'    # Format TRX jest kompatybilny z VSTest
    testResultsFiles: '**/test-results.trx' # Wyszukaj wszystkie pliki .trx wygenerowane przez testy
    searchFolder: '$(System.DefaultWorkingDirectory)' # Przeszukaj cały katalog roboczy agenta
    mergeTestResults: true         # Połącz wyniki z wielu projektów testowych w jeden przebieg
    failTaskOnFailedTests: true    # Oznacz cały pipeline jako nieudany, jeśli jakikolwiek test zawiódł
    testRunTitle: '.NET Tests ($(Agent.JobName))' # Nadaj tytuł przebiegowi testów w ADO